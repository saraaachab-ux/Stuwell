<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>StuWell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="StuWell: student well-being check-ins, screeners, medical requests and a director dashboard.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&display=swap">
<style>
/* Layout: one calm column on phones, two-column hero and card grids from tablet up. Warm cream ground, sage cards, terracotta for the always-visible Help now. */
:root{
  --bg:#F8F5EE; --surface:#FFFDF9; --surface-2:#F0ECE1; --ink:#15233B; --ink-soft:#4F5B6E; --line:#E4DED0;
  --sage:#E0EBDD; --sage-ink:#1F4A37; --primary:#3D6650; --on-primary:#FFFFFF;
  --clay:#F6D6C9; --clay-ink:#6A2B17;
  --blue:#1B6FC2; --brand-green:#128A5C; --blue-soft:#E3EEF9;
  --ok-soft:#DCEBDD; --ok-ink:#1F5B3A; --warn-soft:#F7E8C4; --warn-ink:#6B4A06; --attn-soft:#F8DEC9; --attn-ink:#7A3A0B; --crit-soft:#F8DAD5; --crit-ink:#8A2318;
  --ill-a:#FBE4D5; --ill-b:#E3EDDD; --ill-sun:#F2B544; --ill-c1:#FFFDF9; --ill-c2:#C9DDC9; --ill-skin:#E8B793; --ill-hair:#4A3326; --ill-top:#3D6650; --ill-pants:#2B3E5C; --ill-bag:#D9805F; --ill-ground:#CFE0CF;
  --shadow:0 1px 2px rgba(21,35,59,.05),0 10px 28px rgba(21,35,59,.07);
  --f-display:'Fraunces','Iowan Old Style','Georgia',serif;
  --f-body:'DM Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-brand:'Baloo 2','Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10181A; --surface:#172224; --surface-2:#1D2B2D; --ink:#EAF1EE; --ink-soft:#A9B7B1; --line:#2A3A3B;
  --sage:#1E3329; --sage-ink:#C3E3D0; --primary:#6FB38C; --on-primary:#0E1F16;
  --clay:#4A2A20; --clay-ink:#F6CDBD;
  --blue:#6DB0F2; --brand-green:#52C990; --blue-soft:#18304A;
  --ok-soft:#1E3329; --ok-ink:#BFE3CC; --warn-soft:#3F3414; --warn-ink:#F0D58A; --attn-soft:#4A2D17; --attn-ink:#F4C79F; --crit-soft:#4A211D; --crit-ink:#F5B7AE;
  --ill-a:#3A2B27; --ill-b:#1E3329; --ill-c1:#2E3F3E; --ill-c2:#35544A; --ill-skin:#D9A57F; --ill-hair:#6B4A38; --ill-top:#6FB38C; --ill-pants:#7FA7D6; --ill-bag:#E39A7A; --ill-ground:#274236;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181A; --surface:#172224; --surface-2:#1D2B2D; --ink:#EAF1EE; --ink-soft:#A9B7B1; --line:#2A3A3B;
  --sage:#1E3329; --sage-ink:#C3E3D0; --primary:#6FB38C; --on-primary:#0E1F16;
  --clay:#4A2A20; --clay-ink:#F6CDBD;
  --blue:#6DB0F2; --brand-green:#52C990; --blue-soft:#18304A;
  --ok-soft:#1E3329; --ok-ink:#BFE3CC; --warn-soft:#3F3414; --warn-ink:#F0D58A; --attn-soft:#4A2D17; --attn-ink:#F4C79F; --crit-soft:#4A211D; --crit-ink:#F5B7AE;
  --ill-a:#3A2B27; --ill-b:#1E3329; --ill-c1:#2E3F3E; --ill-c2:#35544A; --ill-skin:#D9A57F; --ill-hair:#6B4A38; --ill-top:#6FB38C; --ill-pants:#7FA7D6; --ill-bag:#E39A7A; --ill-ground:#274236;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28);
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;padding-block:0 56px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2.3rem,7.2vw,3.7rem);font-weight:600;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,4.6vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.soft{color:var(--ink-soft)}
.small{font-size:.9rem}
.label{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--ink-soft)}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:20px}
.sec{padding-block:44px 0;display:flex;flex-direction:column;gap:22px}
.sec-sub{max-width:58ch;color:var(--ink-soft)}
.ico{flex:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:inherit}
.wm{font-family:var(--f-brand);font-weight:800;font-size:1.75rem;line-height:1;letter-spacing:-.01em;display:inline-flex}
.wm .a{color:var(--blue)} .wm .b{color:var(--brand-green)}
.help-pill{display:inline-flex;align-items:center;gap:8px;background:var(--clay);color:var(--clay-ink);border:0;border-radius:999px;padding:11px 18px;min-height:46px;font-weight:600;cursor:pointer;white-space:nowrap;transition:transform .12s,filter .15s}
.help-pill:hover{filter:brightness(.96)} .help-pill:active{transform:translateY(1px)}
.tabs{display:flex;gap:6px;padding-block:4px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--ink-soft);border-radius:999px;padding:11px 22px;font-weight:500;cursor:pointer;white-space:nowrap;min-height:46px;transition:background .15s,color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:12px 22px;min-height:50px;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s,filter .15s}
.btn:hover{border-color:var(--primary)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);padding-inline:28px}
.btn.primary:hover{filter:brightness(1.08)}
.btn.clay{background:var(--clay);color:var(--clay-ink);border-color:transparent}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:14px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:42px;padding:8px 18px;font-size:.95rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:30px;padding-block:34px 4px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--sage);color:var(--sage-ink);border-radius:999px;padding:9px 18px;font-weight:600;font-size:.95rem;width:fit-content}
.hero h1 em{font-style:italic;color:var(--primary);font-weight:500}
.hero p.lead{font-size:1.2rem;line-height:1.65;color:var(--ink-soft);max-width:46ch}
.privacy{display:flex;align-items:center;gap:10px;color:var(--ink-soft);font-size:.95rem}
.illo{border-radius:30px;overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3;max-width:100%;background:var(--ill-b)}
.illo svg{display:block;width:100%;height:100%}
@media (min-width:860px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;padding-block:56px 8px}}

/* sage cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:16px}
.sage-card{background:var(--sage);color:var(--sage-ink);border-radius:26px;padding:28px 26px 30px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sage-card h3{color:var(--ink)}
.sage-card p{color:var(--ink-soft);line-height:1.65}
.sage-card .ic{width:50px;height:50px;border-radius:15px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.checkup{text-align:left;border:0;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.checkup:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.checkup .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;font-weight:600;color:var(--sage-ink)}
.checkup .go{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--primary);margin-top:4px}

/* flow cards (check-in and screeners) */
.flow{max-width:720px;margin-inline:auto;padding-block:32px 0;display:flex;flex-direction:column;gap:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:30px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.scale button,.opt{border:1px solid var(--line);background:var(--bg);border-radius:18px;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.scale button{min-height:68px;font-size:1.4rem;font-family:var(--f-display)}
.scale button:hover,.opt:hover{border-color:var(--primary);background:var(--sage)}
.scale button[aria-pressed="true"],.opt[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.anch{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--ink-soft)}
.optlist{display:grid;gap:10px}
.opt{text-align:left;padding:15px 20px;min-height:56px;font-size:1rem;font-weight:500}
.checks{display:flex;flex-direction:column;gap:10px}
.checks label{display:flex;gap:14px;align-items:flex-start;padding:15px 18px;border:1px solid var(--line);border-radius:18px;background:var(--bg);cursor:pointer;line-height:1.45;transition:background .15s,border-color .15s}
.checks label:hover{border-color:var(--primary);background:var(--sage)}
.checks input{margin-top:3px;width:20px;height:20px;accent-color:var(--primary);flex:none}
.nav{display:flex;justify-content:space-between;gap:12px;align-items:center}

/* result */
.forecast{display:grid;gap:18px;align-items:center;background:var(--sage);color:var(--sage-ink);border-radius:28px;padding:28px 26px}
.forecast .wi{width:84px;height:84px;border-radius:24px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.forecast h2{color:var(--ink)}
.forecast .idx{font-weight:700;font-size:.95rem}
.tone-attn{background:var(--attn-soft);color:var(--attn-ink)} .tone-warn{background:var(--warn-soft);color:var(--warn-ink)}
.tone-crit{background:var(--crit-soft);color:var(--crit-ink)} .tone-ok{background:var(--ok-soft);color:var(--ok-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface-2);border-radius:999px;padding:6px 14px;font-size:.9rem;font-weight:500}
.crisis{background:var(--crit-soft);color:var(--crit-ink);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.crisis h3{color:inherit}
.note{background:var(--warn-soft);color:var(--warn-ink);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.note h3{color:inherit;font-size:1.15rem}
.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.tipgroup{border-left:3px solid var(--primary);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:4px}
.tipgroup ul{margin:4px 0 0;padding-left:18px}
.fine{font-size:.88rem;color:var(--ink-soft);line-height:1.55}

/* diary */
.diary{display:flex;flex-direction:column;gap:10px}
.dr{display:grid;grid-template-columns:78px minmax(0,1fr) 112px;gap:12px;align-items:center;font-size:.92rem}
.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
.empty{border:1.5px dashed var(--line);border-radius:24px;padding:28px 22px;text-align:center;color:var(--ink-soft);display:flex;flex-direction:column;gap:6px;align-items:center}

/* tools */
.toolpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.tp{border:2px solid transparent;background:var(--sage);color:var(--sage-ink);border-radius:22px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,transform .15s}
.tp:hover{transform:translateY(-2px)}
.tp[aria-pressed="true"]{border-color:var(--primary);background:var(--surface)}
.tp b{font-family:var(--f-display);font-weight:600;font-size:1.1rem;color:var(--ink)}
.tp span.d{font-size:.88rem;color:var(--ink-soft);line-height:1.4}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:30px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.tool>*{max-width:560px}
.seg{display:inline-flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;flex-wrap:wrap;justify-content:center}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;color:var(--ink-soft);min-height:42px}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.orb-wrap{width:min(78vw,300px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.orb-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.orb{width:56%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--sage),var(--primary));transform:scale(.6);transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center;color:var(--on-primary);font-weight:700;font-size:1.15rem;text-align:center}
.timer{font-family:var(--f-display);font-size:clamp(3.4rem,16vw,5.4rem);font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.gstep{font-family:var(--f-display);font-size:clamp(1.5rem,5vw,2rem);line-height:1.25}
.gnum{font-family:var(--f-display);font-size:4.4rem;color:var(--primary);line-height:1}
textarea.field,select.field,input.field{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:14px 16px;min-height:52px;font-size:1rem}
textarea.field{min-height:140px;resize:vertical;line-height:1.55}
textarea.field:focus,select.field:focus{outline:0;border-color:var(--primary);box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent)}
.wd{transition:opacity .6s,transform .6s}
.wd.gone{opacity:0;transform:translateY(-14px) scale(.98)}
.ckl{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left}

/* topics, builder, faq */
.topics{display:flex;flex-direction:column;gap:12px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.topic-h,.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;background:none;border:0;padding:20px 24px;cursor:pointer;min-height:64px}
.topic-h:hover,.faq-q:hover{background:var(--surface-2)}
.topic-h b,.faq-q span:first-child{font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.3}
.chev{flex:none;transition:transform .2s;color:var(--ink-soft)}
.topic-b{padding:4px 24px 26px;display:flex;flex-direction:column;gap:14px}
.topic-b ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.seek{background:var(--warn-soft);color:var(--warn-ink);border-radius:16px;padding:14px 18px}
.builder{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.fields{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-weight:600;font-size:.92rem}
.msgbox{background:var(--sage);color:var(--ink);border-radius:22px;padding:22px 24px;font-size:1.05rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.faq{background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.faq-i{border-bottom:1px solid var(--line)} .faq-i:last-child{border-bottom:0}
.faq-a{padding:0 24px 24px;color:var(--ink-soft);line-height:1.7;max-width:66ch}
.reach{display:flex;gap:16px;align-items:center;background:var(--clay);color:var(--clay-ink);border-radius:26px;padding:24px 26px;flex-wrap:wrap;justify-content:space-between}
.reach p{max-width:46ch}
.reach h3{color:inherit}

/* medical request */
.mr{display:grid;gap:24px;align-items:start}
@media (min-width:900px){.mr{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}}
.req{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.req p{overflow-wrap:anywhere}
.pill{display:inline-block;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:700;white-space:nowrap}
select.field.inl{width:auto;min-height:42px;padding:8px 14px}
input.field{min-width:0}

/* dialog */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(10,20,22,.6);display:flex;align-items:flex-end;justify-content:center;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:0;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.dialog{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:26px max(22px,env(safe-area-inset-left,0px)) max(26px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.numrow{display:flex;justify-content:space-between;align-items:center;gap:14px;border:1px solid var(--line);border-radius:18px;padding:12px 16px;background:var(--bg)}
.numrow .n{font-family:var(--f-display);font-size:1.7rem;font-weight:600;color:var(--clay-ink);background:var(--clay);border-radius:12px;padding:2px 14px;text-decoration:none;font-variant-numeric:tabular-nums}
.numrow div{min-width:0}
@media (min-width:640px){.backdrop{align-items:center;padding:16px}.dialog{border-radius:28px}}

footer.foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;color:var(--ink-soft);font-size:.88rem;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;z-index:70;max-width:90vw;box-shadow:var(--shadow)}

@media (min-width:700px){.forecast{grid-template-columns:auto 1fr;gap:26px}.panel{padding:36px 40px}}
@media (max-width:480px){.dr{grid-template-columns:62px minmax(0,1fr) 96px;gap:8px}.wm{font-size:1.5rem}.help-pill{padding:10px 14px}.scale{gap:6px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== app shell, landing, menu, director ===== */
:root{--lv-urgent:#B3261E;--lv-attn:#D9731B;--lv-watch:#D9A21B;--lv-ok:#3D8B5E;--lv-none:#B9B4A6;--shadow-lg:0 4px 10px rgba(21,35,59,.06),0 28px 64px rgba(21,35,59,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lv-urgent:#F28B82;--lv-attn:#F2A25C;--lv-watch:#E8C45A;--lv-ok:#6FB38C;--lv-none:#5B6B66;--shadow-lg:0 4px 10px rgba(0,0,0,.35),0 28px 64px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--lv-urgent:#F28B82;--lv-attn:#F2A25C;--lv-watch:#E8C45A;--lv-ok:#6FB38C;--lv-none:#5B6B66;--shadow-lg:0 4px 10px rgba(0,0,0,.35),0 28px 64px rgba(0,0,0,.45)}
html{scroll-padding-top:96px}
.tone-none{background:var(--surface-2);color:var(--ink-soft)}
.btn.light{background:var(--surface);color:var(--ink);border-color:transparent}
.btn.line-light{background:transparent;color:inherit;border-color:currentColor}
.top-right{display:flex;align-items:center;gap:10px}
.mode-chip{border-radius:999px;padding:6px 14px;font-size:.82rem;font-weight:700;background:var(--sage);color:var(--sage-ink);white-space:nowrap}
.mode-chip.dir{background:var(--ink);color:var(--bg)}
.mode-chip.soft{background:var(--surface-2);color:var(--ink-soft)}
.nav-links{display:none;gap:2px;align-items:center}
.nl{color:var(--ink-soft);text-decoration:none;font-weight:500;padding:10px 14px;border-radius:999px;transition:background .15s,color .15s}
.nl:hover{background:var(--surface-2);color:var(--ink)}
@media (min-width:1000px){.nav-links{display:flex}}
@media (max-width:620px){.mode-chip{display:none}}
@media (max-width:400px){.brand svg{width:36px;height:36px}.help-pill{padding:10px 12px}.wm{font-size:1.4rem}}
.menu-wrap{position:relative}
.menu-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}
.menu-btn:hover,.menu-btn[aria-expanded="true"]{background:var(--surface-2);border-color:var(--primary)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:min(330px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);padding:8px;z-index:50;display:flex;flex-direction:column;gap:2px;max-height:min(78vh,640px);overflow:auto}
.mi{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:16px;padding:12px 14px;cursor:pointer;color:var(--ink);min-height:50px}
.mi:hover{background:var(--surface-2)}
.mi .ico{color:var(--primary)}
.mi b{font-weight:600}
.mdiv{border:0;border-top:1px solid var(--line);margin:6px 8px}
.mtheme{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.mconfirm{padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* landing */
.lsec{padding-block:84px 0}
.lhero{position:relative;isolation:isolate;overflow-x:clip}
.blobs{position:absolute;inset:0;z-index:-1;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.6;animation:floaty 18s ease-in-out infinite alternate}
.b1{width:440px;height:440px;left:-80px;top:20px;background:var(--sage)}
.b2{width:380px;height:380px;right:-60px;top:140px;background:var(--clay)}
.b3{width:300px;height:300px;left:38%;top:400px;background:var(--blue-soft)}
@keyframes floaty{to{transform:translate(34px,-26px) scale(1.1)}}
.lhero-in{display:grid;grid-template-columns:minmax(0,1fr);gap:44px;padding-block:48px 36px;align-items:center}
.lhero-in>*{min-width:0}
.mock .illo{border-radius:34px;box-shadow:var(--shadow-lg)}
.lhero h1{font-size:clamp(2.6rem,8.6vw,4.7rem);line-height:1.04}
.lhero h1 em{font-style:italic;color:var(--primary);font-weight:500}
.lhero .lead{font-size:1.2rem;line-height:1.65;color:var(--ink-soft);max-width:48ch}
@media (min-width:960px){.lhero-in{grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:64px;padding-block:84px 48px}}
.doors{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));max-width:760px}
.door{text-align:left;border:0;cursor:pointer;border-radius:28px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:10px;min-height:186px;transition:transform .18s,box-shadow .18s;text-decoration:none;color:inherit}
.door:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.door.stu{background:var(--primary);color:var(--on-primary)}
.door.prof{background:var(--blue);color:#fff}
.door.dir{background:var(--ink);color:var(--bg)}
.door .dic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.2);display:inline-flex;align-items:center;justify-content:center}
.door.dir .dic{background:rgba(255,255,255,.14)}
.door .dk{font-family:var(--f-display);font-size:1.55rem;font-weight:600;line-height:1.15}
.door p{opacity:.9;font-size:.95rem;line-height:1.5}
@media (min-width:700px){.doors{grid-template-columns:repeat(3,minmax(0,1fr));max-width:720px}.door{padding:18px 16px;min-height:0}.door .dk{font-size:1.2rem}.door p{font-size:.86rem}}
.door .go{margin-top:auto;display:inline-flex;align-items:center;gap:8px;font-weight:600}
.mock{position:relative;max-width:440px;margin-inline:auto;width:100%;padding-block:20px}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:38px;padding:26px 24px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;gap:16px}
.phone-q{font-family:var(--f-display);font-size:1.5rem;line-height:1.2}
.range{width:100%;accent-color:var(--primary);height:34px}
.demo-out{border-radius:24px;background:var(--sage);color:var(--sage-ink);padding:18px;display:flex;gap:16px;align-items:center;min-height:112px}
.demo-out .wi{flex:none;width:64px;height:64px;border-radius:20px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--primary)}
.demo-out b{font-family:var(--f-display);font-size:1.3rem;color:var(--ink);display:block}
.demo-out span.t{font-size:.92rem;line-height:1.45;color:var(--ink-soft)}
.fl{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow);font-size:.86rem;display:flex;gap:10px;align-items:center;animation:bob 6s ease-in-out infinite alternate;max-width:78%}
.fl b{display:block;font-size:.9rem}
.fl1{top:2px;right:0}.fl2{bottom:2px;left:0;animation-delay:-3s}
@media (min-width:960px){.fl1{right:-26px}.fl2{left:-34px}}
@keyframes bob{to{transform:translateY(-9px)}}
.lstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.lstat{background:var(--surface);padding:24px 22px;display:flex;flex-direction:column;gap:2px}
.lstat b{font-family:var(--f-display);font-size:2.4rem;line-height:1.1;font-weight:600}
.lh{display:flex;flex-direction:column;gap:12px;margin-bottom:30px;max-width:62ch}
.lh h2{font-size:clamp(1.9rem,5vw,2.9rem)}
.kicker{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.bento{display:grid;gap:16px;grid-template-columns:repeat(6,minmax(0,1fr))}
.bt{border-radius:32px;padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;overflow:hidden;position:relative}
.bt h3{font-size:1.45rem}
.bt p{color:var(--ink-soft);line-height:1.6}
.bt.s4{grid-column:span 4}.bt.s3{grid-column:span 3}.bt.s2{grid-column:span 2}.bt.s6{grid-column:span 6}
.t-sage{background:var(--sage)}.t-clay{background:var(--clay);color:var(--clay-ink)}.t-clay p,.t-clay h3{color:inherit}
.t-surf{background:var(--surface);border:1px solid var(--line)}.t-blue{background:var(--blue-soft)}
.t-ink{background:var(--ink);color:var(--bg)}.t-ink h3{color:var(--bg)}.t-ink p{color:color-mix(in srgb,var(--bg) 78%,transparent)}
@media (max-width:900px){.bento{grid-template-columns:minmax(0,1fr)}.bt.s4,.bt.s3,.bt.s2,.bt.s6{grid-column:auto}}
@media (min-width:901px) and (max-width:1100px){.bt.s2{grid-column:span 3}}
.mini-bars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.mini-bars div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;font-size:.86rem}
.mini-bars i{display:block;height:11px;border-radius:99px;background:var(--primary);width:var(--w)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset span{background:var(--surface-2);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem}
.skel{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.skel i{display:block;height:9px;border-radius:99px;background:color-mix(in srgb,currentColor 20%,transparent)}
.orb-mini{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--sage),var(--primary));animation:pulse 5s ease-in-out infinite;align-self:flex-start}
@keyframes pulse{0%,100%{transform:scale(.78)}50%{transform:scale(1.1)}}
.levelbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.levelbar i{display:block;height:100%}
.lv-urgent{background:var(--lv-urgent)}.lv-attention{background:var(--lv-attn)}.lv-watch{background:var(--lv-watch)}.lv-stable{background:var(--lv-ok)}.lv-none{background:var(--lv-none)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.88rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.steps3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.st{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:28px;display:flex;flex-direction:column;gap:12px}
.st .no{width:46px;height:46px;border-radius:50%;background:var(--sage);color:var(--sage-ink);display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:1.3rem;font-weight:600}
.st p{color:var(--ink-soft)}
.aud{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.ap{border-radius:34px;padding:34px 30px;display:flex;flex-direction:column;gap:18px}
.ap h3{font-size:1.7rem}
.ap ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ap li{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.ap li .ico{margin-top:2px;flex:none}
.ap.stu{background:var(--sage);color:var(--sage-ink)}.ap.stu h3{color:var(--ink)}.ap.stu li{color:var(--ink)}
.ap.prof{background:var(--blue-soft);color:var(--ink)}.ap.prof h3,.ap.prof li{color:var(--ink)}
.ap.dir{background:var(--ink);color:var(--bg)}.ap.dir h3{color:var(--bg)}
.twocol{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.listcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:26px;display:flex;flex-direction:column;gap:12px}
.listcard ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-soft)}
.cta{border-radius:40px;background:var(--primary);color:var(--on-primary);padding:56px 28px;text-align:center;display:flex;flex-direction:column;gap:20px;align-items:center}
.cta h2{color:inherit;font-size:clamp(2rem,6vw,3.2rem)}
.cta p{max-width:48ch;opacity:.92}
.lfoot{margin-top:84px;border-top:1px solid var(--line);padding-block:44px 8px;display:grid;gap:30px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.lfoot h4{font-family:var(--f-body);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;font-weight:700}
.lfoot a,.lfoot button.lk{display:block;color:var(--ink);text-decoration:none;padding:5px 0;background:none;border:0;font:inherit;cursor:pointer;text-align:left}
.lfoot a:hover,.lfoot button.lk:hover{color:var(--primary);text-decoration:underline}
.lfine{padding-block:22px 6px;color:var(--ink-soft);font-size:.86rem;line-height:1.6;max-width:90ch}
@supports (animation-timeline:view()){
  .rv{animation:rv linear both;animation-timeline:view();animation-range:entry 0% entry 32%}
  @keyframes rv{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.rv{animation:none!important;opacity:1!important;transform:none!important}}

/* director */
.dstats{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.dstat{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:4px}
.dstat b{font-family:var(--f-display);font-size:2.5rem;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.dgrid{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.dgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.dgrid .panel{padding:26px 24px;gap:16px}
.hbar{display:grid;grid-template-columns:128px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:.9rem}
.hbar .bar{height:12px}
@media (max-width:480px){.hbar{grid-template-columns:96px minmax(0,1fr) 28px}}
.alert{background:var(--crit-soft);color:var(--crit-ink);border-radius:26px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.alert h3{color:inherit}
.mini-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mini-row:last-child{border-bottom:0}
.filters{display:flex;gap:12px;flex-wrap:wrap}
.filters .fld{flex:1 1 180px}
.slist{background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.swrap{border-bottom:1px solid var(--line)}.swrap:last-child{border-bottom:0}
button.srow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:10px 20px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:16px 22px;cursor:pointer;min-height:72px}
button.srow:hover{background:var(--surface-2)}
@media (max-width:700px){button.srow{grid-template-columns:minmax(0,1fr) auto}button.srow .chips{grid-column:1/-1;order:3}}
.sbody{padding:6px 22px 26px;display:grid;gap:26px;grid-template-columns:minmax(0,1fr)}
@media (min-width:920px){.sbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.spark{color:var(--primary);flex:none}
.pb{border-left:3px solid var(--primary);padding:2px 0 2px 16px;display:flex;flex-direction:column;gap:6px}
.pb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.choice{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--bg);cursor:pointer;line-height:1.5;transition:background .15s,border-color .15s}
.choice:hover{border-color:var(--primary);background:var(--sage)}
.choice input{margin-top:4px;width:20px;height:20px;accent-color:var(--primary);flex:none}
.choice:has(input:checked){border-color:var(--primary);background:var(--sage)}

.nl{background:none;border:0;font:inherit;cursor:pointer}
.foot{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;color:var(--ink-soft);font-size:.88rem;line-height:1.6}
.lfine{color:var(--ink-soft);font-size:.9rem;line-height:1.6;max-width:70ch;margin-top:22px}
.anch{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;color:var(--ink-soft)}
.srow .chips{min-width:0}
@media (max-width:600px){.fl1{right:8px;top:-4px}.fl2{left:8px;bottom:-4px}}
.mock{padding-block:18px}
.tabs.fit .tab{flex:1 1 auto;text-align:center}
@media (max-width:620px){.tabs.fit .tab{padding-inline:6px;font-size:.92rem}}
@media (max-width:620px){.tab{padding:11px 13px}.tabs{gap:2px}}

/* ===== professional polish: brand gradient, glass header, depth, rhythm ===== */
:root{--g1:#1B6FC2;--g2:#128A5C;--on-g:#FFFFFF;--navy:#0F1B33;--navy-2:#16294A;--glow:rgba(27,111,194,.35);--brand-grad:linear-gradient(135deg,var(--g1),var(--g2))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#4C9BEA;--g2:#3FBF86;--on-g:#08141A;--navy:#0B1626;--navy-2:#12233D;--glow:rgba(76,155,234,.3)}}
:root[data-theme="dark"]{--g1:#4C9BEA;--g2:#3FBF86;--on-g:#08141A;--navy:#0B1626;--navy-2:#12233D;--glow:rgba(76,155,234,.3)}
header.top{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.btn{transition:transform .15s,box-shadow .2s,border-color .15s,background .15s}
.btn.primary{background:var(--brand-grad);color:var(--on-g);border-color:transparent;box-shadow:0 10px 24px -8px var(--glow)}
.btn.primary:hover{filter:none;transform:translateY(-2px);box-shadow:0 16px 30px -10px var(--glow)}
.btn.light{box-shadow:0 8px 20px -10px rgba(0,0,0,.35)}
.btn.light:hover{transform:translateY(-2px)}
.tab[aria-current="page"]{background:color-mix(in srgb,var(--g1) 14%,var(--surface));color:var(--ink);box-shadow:inset 0 -2px 0 var(--g1)}
.panel,.req,.dstat,.listcard,.st{box-shadow:0 1px 2px rgba(15,27,51,.04),0 14px 34px -14px rgba(15,27,51,.18)}
.dstat{position:relative;overflow:hidden}.dstat::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--brand-grad)}
.dstat b{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.help-pill{box-shadow:0 8px 20px -10px rgba(138,35,24,.45)}

/* landing hero */
.lhero{background:radial-gradient(1200px 520px at 85% -10%,color-mix(in srgb,var(--g1) 16%,transparent),transparent 60%),radial-gradient(900px 480px at 0% 10%,color-mix(in srgb,var(--g2) 15%,transparent),transparent 60%)}
.lhero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1.1px,transparent 1.2px);background-size:26px 26px;-webkit-mask-image:linear-gradient(180deg,#000 0,transparent 75%);mask-image:linear-gradient(180deg,#000 0,transparent 75%)}
.b1{background:color-mix(in srgb,var(--g2) 38%,var(--bg))}.b2{background:var(--clay)}.b3{background:color-mix(in srgb,var(--g1) 30%,var(--bg))}
.lhero h1{font-size:clamp(2.7rem,9vw,5rem);letter-spacing:-.03em;line-height:1.02}
.lhero h1 em{background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600;padding-right:.06em}
.lhero .badge{background:color-mix(in srgb,var(--g1) 12%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--g1) 25%,transparent)}
.lhero .badge .ico{color:var(--g1)}
.door{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 36px -18px rgba(15,27,51,.5)}
.door::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12);pointer-events:none}
.door.stu{background:linear-gradient(145deg,#16A06F,#0B6B47);color:#fff}
.door.prof{background:linear-gradient(145deg,#2C86E0,#134F8F);color:#fff}
.door.dir{background:linear-gradient(145deg,#1B2E52,#0A1325);color:#fff}
.door .go{transition:gap .2s}.door:hover .go{gap:14px}
.mock .illo{border:6px solid var(--surface);border-radius:38px;transform:rotate(-1.4deg);transition:transform .4s}
.mock:hover .illo{transform:rotate(0)}
.fl{border-radius:18px;backdrop-filter:blur(8px)}
.lstats{border:0;background:transparent;gap:14px}
.lstat{border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 30px -18px rgba(15,27,51,.25)}

function computeCheckin() {
  const a = S.ans, c = S.concerns;
  const idx = (a.mood + a.sleep + a.social + (6 - a.stress) + (6 - a.workload)) / 5;
  const flags = [];
  if (c.bullying) flags.push("bullying");
  if (c.home) flags.push("home");
  if (c.health) flags.push("health");
  if (a.mood <= 2) flags.push("lowMood");
  if (a.social <= 2) flags.push("lonely");
  if (a.sleep <= 2) flags.push("sleep");
  if (a.stress >= 4) flags.push("stress");
  if (a.workload >= 4) flags.push("workload");
  if (c.wantsTalk) flags.push("wantsTalk");
  return { idx, fc: FORECASTS.find(f => idx >= f.min), flags,

const F = { mode: "focus", left: 1500, run: false, end: 0, iv: null, done: 0 };
function stopBreath() {
  clearTimeout(R.bt); R.running = false;
  const o = $("#orb"), b = $("#bbtn");
  if (o) { o.style.transition = "transform .6s ease-in-out"; o.style.transform = "scale(.6)"; o.textContent = "Ready"; }
  if (b) b.textContent = "Start";
}
function startBreath() {
  if (R.running) { stopBreath(); return; }
  R.running = true; R.cycles = 0;
  const ph = PATTERNS[S.pat].ph; let i = 0;
  $("#bbtn").textContent = "Stop"; $("#bcount").textContent = "Cycles: 0";
  const step = () => {
    const o = $("#orb");
    if (!R.running || !o) { R.running = false; return; }
    const [label, secs, sc] = ph[i];
    o.textContent = label;
    o.style.transition = `transform ${secs}s ease-in-out`;
    o.style.transform = `scale(${sc === 1 ? 1.3 : .6})`;
    R.bt = setTimeout(() => {
      i++;
      if (i >= ph.length) { i = 0; R.cycles++; const c = $("#bcount"); if (c) c.textContent = "Cycles: " + R.cycles; }
      step();
    }, secs * 1000);
  };
  requestAnimationFrame(step);
}
function fTotal() { return F.mode === "focus" ? 1500 : 300; }
function fPaint() {
  const t = $("#ftime"), b = $("#fbtn"), d = $("#fdone");
  if (t) t.textContent = fmtTime(F.left);
  if (b) b.textContent = F.run ? "Pause" : "Start";
  if (d) d.textContent = "Focus blocks finished this visit: " + F.done;
}
function fTick() {
  if (!F.run) return;
  F.left = Math.max(0, Math.round((F.end - Date.now()) / 1000));
  if (F.left <= 0) {
    F.run = false; clearInterval(F.iv);
    if (F.mode === "focus") F.done++;
    toast(F.mode === "focus" ? "Focus block done. Take 5 minutes." : "Break over. Ready when you are.");
    F.mode = F.mode === "focus" ? "break" : "focus"; F.left = fTotal();
  }
  fPaint();
}
function fToggle() {
  if (F.run) { F.run = false; clearInterval(F.iv); }
  else { F.run = true; F.end = Date.now() + F.left * 1000; clearInterval(F.iv); F.iv = setInterval(fTick, 500); }
  fPaint();
}
function cleanupTools() { stopBreath(); }

async function initLive() {
  try {
    if (!(window.claude && typeof window.claude.use === "function")) { LIVE.ready = true; if (S.mode === "director" || S.mode === "professor") render(); return; }
    LIVE.user = await window.claude.use("user");
    LIVE.db = await window.claude.use("db");
    if (LIVE.user) {
      try { LIVE.uid = await LIVE.user.id(); } catch (e) { /* no id */ }
      try { LIVE.edit = await LIVE.user.canEdit(); } catch (e) { LIVE.edit = false; }
      try { LIVE.write = await LIVE.user.can("data.write"); } catch (e) { /* unknown */ }
    }
    if (LIVE.db && LIVE.uid) {
      try {
        LIVE.db.doc("replies/" + LIVE.uid).onSnapshot(s => {
          REPL = s.exists ? (s.data() || {}) : {};
          if (S.mode === "student" && S.tab === "medical") refreshMedList();
        }, () => { /* replies unavailable */ });
      } catch (e) { /* ignore */ }
    }
    if (LIVE.db && LIVE.edit) {
      try {
        LIVE.db.collection("shared").onSnapshot(s => { DIR.students = s.docs.map(d => Object.assign({ id: d.id }, d.data() || {})); dirRefresh(); }, e => { LIVE.err = (e && e.message) || "Could not read student data."; dirRefresh(); });
        LIVE.db.collection("replies").onSnapshot(s => { const m = {}; s.docs.forEach(d => { m[d.id] = d.data() || {}; }); DIR.replies = m; dirRefresh(); }, () => { /* ignore */ });
      } catch (e) { LIVE.err = String((e && e.message) || e); }
    }
  } catch (e) { LIVE.err = String((e && e.message) || e); }
  LIVE.ready = true;
  if (S.mode === "director" || S.mode === "professor") render(); else renderHeader();
}
function sharedPayload() {
  const pf = D.profile, share = !!pf.share;
  return {
    name: (pf.name || "").trim().slice(0, 60), cls: (pf.cls || "").trim().slice(0, 30), share, updated: Date.now(),
    checkins: share ? D.checkins.slice(-12).map(c => ({ ts: c.ts, idx: c.idx, flags: c.flags || [], unsafe: !!c.unsafe })) : [],
    checkups: share ? D.checkups.slice(-8).map(c => ({ ts: c.ts, kind: c.kind, score: c.score, max: c.max, safety: !!c.safety })) : [],
    requests: D.requests.filter(r => r.sent).map(r => ({ id: r.id, ts: r.ts, type: r.type, to: r.to || "director", notes: r.notes, from: r.from || "", until: r.until || "", cert: !!r.cert }))
  };
}
function pushShared() {
  if (!canShare()) return Promise.resolve(false);
  const pf = D.profile;
  if (!pf.share && !pf.pushed && !D.requests.some(r => r.sent)) return Promise.resolve(true);
  const body = sharedPayload();
  pushQ = pushQ.then(async () => {
    try { await LIVE.db.doc("shared/" + LIVE.uid).set(body); if (!pf.pushed) { pf.pushed = true; save(); } return true; }
    catch (e) { LIVE.err = String((e && e.message) || e); return false; }
  });
  return pushQ;
}

function genDemo() {

  };
  return DEMO.map((d, k) => {
    const days = d.none ? [26, 24, 22] : [9, 7, 5, 3, 1, 0];
    const checkins = days.map((ago, i) => {
      const last = i === days.length - 1;
      let [mood, sleep, stress, social, work] = d.base.slice();
      if (d.trend && !last) { mood++; sleep++; stress--; social++; work--; }
      mood = clamp(mood); sleep = clamp(sleep); stress = clamp(stress); social = clamp(social); work = clamp(work);
      let idx = (mood + sleep + social + (6 - stress) + (6 - work)) / 5;
      if (!last && !d.trend) idx = clamp(idx + ((k + i) % 3 - 1) * 0.2);
      return { ts: now - ago * DAY - (last ? 2 * 3600000 : 0), idx: Math.round(idx * 10) / 10, flags: last ? d.flags.slice() : [], unsafe: last && d.flags.includes("unsafe") };
    });
    const checkups = (d.screens || []).map(s => ({ ts: now - 3 * DAY, kind: s[0], score: s[1], max: { phq9: 27, gad7: 21, asrs: 6 }[s[0]], safety: !!s[2] }));
    return { id: "demo" + k, demo: true, name: d.n, cls: d.c, share: true, checkins, checkups, requests: reqs[d.n] || [], updated: now };
  });
}

function replyFor(st, r) { const m = st.demo ? S.demoReplies[st.id] : DIR.replies[st.id]; return m ? m["r_" + r.id] || null : null; }
function dirRequests() {

  dirStudents().forEach(st => (st.requests || []).forEach(r => out.push({ st, r, rp: replyFor(st, r) })));
  return out.sort((a, b) => (a.rp ? 1 : 0) - (b.rp ? 1 : 0) || b.r.ts - a.r.ts);

function evalStudent(st) {
  const cks = (st.checkins || []).slice().sort((a, b) => a.ts - b.ts);
  const last = cks[cks.length - 1], now = Date.now();
  const fresh = !!last && now - last.ts < 14 * DAY;
  const fl = [];
  if (fresh) { (last.flags || []).forEach(f => fl.push(f)); if (last.unsafe) fl.push("unsafe"); }
  (st.checkups || []).filter(c => now - c.ts < 30 * DAY).forEach(c => {
    if (c.kind === "phq9") { if (c.safety) fl.push("screenSafety"); if (c.score >= 10) fl.push("screenPHQ"); }
    if (c.kind === "gad7" && c.score >= 10) fl.push("screenGAD");
    if (c.kind === "asrs" && c.score >= 4) fl.push("screenADHD");
  });
  if (fresh && cks.length >= 3) { const prev = cks.slice(-4, -1), avg = prev.reduce((s, c) => s + c.idx, 0) / prev.length; if (avg - last.idx >= 0.9) fl.push("decline"); }
  const flags = REASON_ORDER.filter(k => fl.includes(k));
  let level = "none";
  if (flags.includes("unsafe") || flags.includes("screenSafety")) level = "urgent";
  else if (["bullying", "home", "wantsTalk", "decline", "screenPHQ", "screenGAD"].some(k => flags.includes(k)) || (fresh && last.idx < 2.2)) level = "attention";
  else if (flags.length || (fresh && last.idx < 3.2)) level = "watch";
  else if (fresh) level = "stable";
  return { level, flags, last, idx: last ? last.idx : null, cks };
}

function spark(cks) {
  const pts = cks.slice(-8); if (pts.length < 2) return "";
  const w = 120, h = 34, xs = i => 3 + i * (w - 6) / (pts.length - 1), ys = v => h - 3 - (Math.max(1, Math.min(5, v)) - 1) / 4 * (h - 6);
  const d = pts.map((c, i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(c.idx).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Trend of the last ${pts.length} check-ins"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${xs(pts.length - 1).toFixed(1)}" cy="${ys(pts[pts.length - 1].idx).toFixed(1)}" r="3.4" fill="currentColor"/></svg>`;
}

      D.requests = D.requests.slice(-30); save(); S.rqSaved = true; refreshMedList();
      pushShared().then(ok => {
        if (!ok) { const r = D.requests.find(x => x.id === id); if (r) { r.sent = false; r.status = "prepared"; save(); } toast("Could not send it. It is saved on this device."); }
        else toast("Sent to your director");
        refreshMedList();
      });
      break; }
    case "rqRemove": { const r = D.requests.find(x => x.id === v); D.requests = D.requests.filter(x => x.id !== v); save(); refreshMedList(); toast("Request removed"); if (r && r.sent) pushShared(); break; }
    case "toTab": S.flow = null; go(v); break;
    case "toTool": S.tool = v; S.flow = null; go("calm"); break;
    case "readTopic": S.flow = null; S.topic = v; go("support"); setTimeout(() => { const t = $("#topic-" + v); if (t) t.scrollIntoView({ block: "start" }); }, 30); break;
    case "clearAsk": S.confirmClear = true; $("#diary").innerHTML = diaryHTML(); break;
    case "clearNo": S.confirmClear = false; $("#diary").innerHTML = diaryHTML(); break;
    case "clearYes": D.checkins = []; D.checkups = []; save(); S.confirmClear = false; $("#diary").innerHTML = diaryHTML(); toast("History cleared"); pushShared(); break;
    case "tool": S.tool = v; renderCalm(); break;
    case "pat": stopBreath(); S.pat = v; renderCalm(); break;
    case "bstart": startBreath(); break;
    case "gnext": S.ground++; renderCalm(); break;
    case "gprev": if (S.ground > 0) { S.ground--; renderCalm(); } break;
    case "gagain": S.ground = 0; renderCalm(); break;
    case "letgo": {
      const box = $("#wdbox"), ta = $("#worry");
      if (!ta || !ta.value.trim()) { toast("Write something first, then let it go"); break; }
      box.classList.add("gone");
      setTimeout(() => { S.worry = ""; renderCalm(); toast("Let go. Nothing was saved."); }, 600);
      break; }
    case "fmode": F.mode = v; F.run = false; clearInterval(F.iv); F.left = fTotal(); renderCalm(); break;
    case "fstart": fToggle(); break;
    case "freset": F.run = false; clearInterval(F.iv); F.left = fTotal(); fPaint(); break;
    case "topic": S.topic = S.topic === v ? null : v; $("#topics").innerHTML = topicsHTML(); break;
    case "faq": S.faq = S.faq === +v ? null : +v; $("#faq").innerHTML = faqHTML(); break;
    case "copy": {
      const txt = buildMsg();
      const fallback = () => { const b = $("#msgout"); if (b) { const rg = document.createRange(); rg.selectNodeContents(b); const sl = getSelection(); sl.removeAllRanges(); sl.addRange(rg); } toast("Message selected. Press and hold to copy."); };
      try { navigator.clipboard.writeText(txt).then(() => toast("Message copied"), fallback); } catch (err) { fallback(); }
      break; }
  }
});
const RQ_FIELDS = { "rq-type": "type", "rq-to": "to", "rq-from": "from", "rq-until": "until", "rq-name": "name", "rq-cls": "cls", "rq-notes": "notes" };
const PF_FIELDS = { "pf-name": "name", "pf-cls": "cls" };
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("[data-c]")) { S.concerns[t.dataset.c] = t.checked; return; }
  if (t.matches("[data-rqs]")) { const r = D.requests.find(x => x.id === t.dataset.rqs); if (r) { r.status = t.value; save(); $("#rq-list").innerHTML = rqListHTML(); } return; }
  if (t.id === "rq-cert") { S.rq.cert = t.checked; refreshRq(); return; }
  if (t.id === "pf-share") { S.pf.share = t.checked; return; }
  if (t.id === "sample-toggle") { S.demo = t.checked; try { localStorage.setItem("stuwell-demo", S.demo ? "1" : "0"); } catch (err) { /* ignore */ } toast(S.demo ? "Sample students on" : "Sample students off"); return; }
  if (t.id === "dcls") { S.fcls = t.value; $("#slist").innerHTML = studentsListHTML(); return; }
  if (t.id === "dlev") { S.flev = t.value; $("#slist").innerHTML = studentsListHTML(); return; }
  if (RQ_FIELDS[t.id]) { S.rq[RQ_FIELDS[t.id]] = t.value; refreshRq(); return; }
  if (t.matches("[data-w]")) {
    S.wind[t.dataset.w] = t.checked;
    const n = WIND.filter((_, i) => S.wind[i]).length, c = $("#wcount");
    if (c) c.textContent = `${n} of ${WIND.length} done${n === WIND.length ? ". Sleep well." : ""}`;
    return;
  }
  const map = { "m-to": "to", "m-about": "about", "m-how": "howlong", "m-want": "want" };
  if (map[t.id]) { S.msg[map[t.id]] = t.value; const o = $("#msgout"); if (o) o.textContent = buildMsg(); }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "worry") S.worry = e.target.value;
  else if (id === "demo-r") { const o = $("#demo-out"); if (o) o.innerHTML = demoOut(+e.target.value); }
  else if (id === "dq") { S.fq = e.target.value; const l = $("#slist"); if (l) l.innerHTML = studentsListHTML(); }
  else if (PF_FIELDS[id]) S.pf[PF_FIELDS[id]] = e.target.value;
  else if (RQ_FIELDS[id]) { S.rq[RQ_FIELDS[id]] = e.target.value; refreshRq(); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (S.dlg) closeDlg();
  else if (S.menu) { S.menu = false; S.confirmWipe = false; renderHeader(); const b = $("#menu-btn"); if (b) b.focus(); }
});
window.addEventListener("hashchange", () => {
  if (location.hash.slice(1) === lastHash) return;
  parseHash(); lastHash = hashFor(); render(); top0();
});

/* ---------- start ---------- */
applyTheme();
parseHash(); lastHash = location.hash.slice(1);
render();
initLive();
</script>
